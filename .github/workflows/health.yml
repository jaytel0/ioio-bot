name: BTB health
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the live service
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-all-errors \
            https://btb.molly-codex.workers.dev/health | jq --exit-status '.service == "BTB" and .status == "ok"'
